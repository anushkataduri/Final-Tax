spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 150MB

# Development only: no SMS gateway yet, so the OTP is written to the log. Never enable this in uat/prod.
taxedge:
  otp:
    log-code: true
